name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Test and build portable
        shell: pwsh
        run: ./scripts/Build-Portable.ps1
      - name: Render interface without opening windows
        shell: pwsh
        run: dotnet run --project tests/Preview/Preview.csproj -c Release -- . output/previews
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NightLightControl-win-x64
          path: |
            dist/NightLightControl-*-win-x64.zip
            dist/SHA256SUMS.txt
            output/previews/*.png
          if-no-files-found: error
          compression-level: 0
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $archive = "./dist/NightLightControl-$version-win-x64.zip"
          gh release create $env:RELEASE_TAG $archive ./dist/NightLightControl/NightLightControl.exe ./dist/SHA256SUMS.txt --verify-tag --prerelease --title "Night Light Control $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la versión.' }
