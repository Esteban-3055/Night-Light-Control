name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # The repository name ends in '.', which Windows cannot use as a normal
      # workspace directory. Fetch into a plain path instead of GITHUB_WORKSPACE.
      - name: Prepare source in a Windows-safe directory
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'night-light-control-source'
          git init $source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare source directory.' }
          git -C $source remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -C $source fetch --depth 1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch source commit.' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out source commit.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Test and build portable
        shell: pwsh
        working-directory: ${{ runner.temp }}/night-light-control-source
        run: ./scripts/Build-Portable.ps1
      - name: Render interface without opening windows
        shell: pwsh
        working-directory: ${{ runner.temp }}/night-light-control-source
        run: dotnet run --project tests/Preview/Preview.csproj -c Release -- . output/previews
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NightLightControl-win-x64
          path: |
            ${{ runner.temp }}/night-light-control-source/dist/NightLightControl-*-win-x64.zip
            ${{ runner.temp }}/night-light-control-source/dist/SHA256SUMS.txt
            ${{ runner.temp }}/night-light-control-source/output/previews/*.png
          if-no-files-found: error
          compression-level: 0
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: ${{ runner.temp }}/night-light-control-source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $archive = "./dist/NightLightControl-$version-win-x64.zip"
          gh release create $env:RELEASE_TAG $archive ./dist/NightLightControl/NightLightControl.exe ./dist/SHA256SUMS.txt --verify-tag --prerelease --title "Night Light Control $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la versión.' }
